[package]
name = "docker-pose"
version = "0.5.0"
edition = "2024"
authors = ["Mariano Ruiz <mrsarm@gmail.com>"]
description = "Command line tool to play with 🐳 Docker Compose files."
license = "GPL-3.0"
readme = "README.md"
homepage = "https://github.com/mrsarm/pose"
repository = "https://github.com/mrsarm/pose"
categories = ["development-tools", "command-line-interface"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
clap-num = "1.2"
colored = "3.0"
serde_yaml = "0.9"
strum_macros = "0.27"
regex = "1.11"
ureq = { version = "3.1", features = ["rustls", "platform-verifier", "gzip", "brotli", "charset"] }
url = "2.5"
http = "1.3"

[dev-dependencies]
pretty_assertions = "1.4.0"
serial_test = "3.0"

[profile.release]
# This is going to be the default soon if not provided
opt-level = "s"
strip = "symbols"

[[bin]]
name = "pose"
path = "src/main.rs"
